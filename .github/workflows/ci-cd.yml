name: CI/CD Pipeline
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python scripts/check_html.py
      - name: Build
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          if-no-files-found: error
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: staging
      - name: Шартты орналастыруды тексеру
        run: |
          test -f staging/index.html
          test -f staging/almansur.html
          test -f staging/nurperzent.html
          echo "Құрастырылған сайт staging каталогына орналастырылды (оқу симуляциясы)."
