name: HTML Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML және сілтемелерді тексеру
        run: python scripts/check_html.py
